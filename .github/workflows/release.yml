name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Standalone Binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build TrafficBox.exe
        run: pyinstaller --clean --noconfirm TrafficBox.spec

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist/TrafficBox.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TrafficBox.exe" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrafficBox-windows-x64
          path: |
            dist/TrafficBox.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/TrafficBox.exe
            dist/SHA256SUMS.txt
